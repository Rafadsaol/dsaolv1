<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>Criar conta | dSaOl IT</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth/auth.css"><script type="module" src="/auth/auth.js"></script></head>
<body class="auth-page"><main class="auth-card"><a class="logo" href="/">dSaOl</a><h1>Criar conta</h1><p>O cadastro público cria uma conta de usuário comum. O painel administrativo exige permissão ADMIN.</p><form id="auth-form" data-mode="register" method="post"><label for="name">Nome completo</label><input id="name" name="name" type="text" maxlength="100" autocomplete="name" required><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><label for="password">Senha (12 a 128 caracteres)</label><input id="password" name="password" type="password" maxlength="128" autocomplete="new-password" required minlength="12"><button class="button primary" type="submit" disabled>Criar conta</button></form><p id="auth-feedback" class="auth-feedback" role="status"></p><nav class="auth-links" aria-label="Conta"><a href="/auth/login.html">Entrar</a><a href="/auth/register.html">Cadastro</a><a href="/auth/forgot.html">Recuperar senha</a><a href="/">Voltar ao site</a></nav><noscript><p>Ative o JavaScript para continuar. Nenhum dado será enviado sem ele.</p></noscript></main></body></html>
